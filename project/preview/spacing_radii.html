<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Corner radii" subtitle="xs, sm (button), md (tile), lg (modal), xl (hero), pill" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-1); font-family: var(--font-ui); }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 80px; height: 80px; background: var(--pp-cream); border: 1.5px solid var(--pp-hairline); box-shadow: var(--sh-paper); }
  .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
  .val { font-size: 10px; color: var(--fg-4); letter-spacing: .1em; }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="lbl">xs</div><div class="val">4px</div></div>
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="lbl">sm · button</div><div class="val">6px</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="lbl">md · tile</div><div class="val">10px</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="lbl">lg · modal</div><div class="val">16px</div></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="lbl">xl · hero</div><div class="val">24px</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="lbl">pill</div><div class="val">∞</div></div>
  </div>
</body></html>
