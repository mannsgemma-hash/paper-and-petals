<!doctype html>
<!-- @dsCard group="Type" name="Type · Display (Spectral)" subtitle="Spectral — screen titles, journal names, hero" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg-1); }
  .row { display: flex; align-items: baseline; gap: 22px; }
  .meta { font-family: var(--font-ui); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-4); width: 100px; flex: 0 0 100px; }
  .specimen { font-family: var(--font-display); color: var(--fg-1); line-height: 1.05; letter-spacing: var(--ls-display); font-weight: 400; }
  .stack > * + * { margin-top: 14px; }
  .footnote { margin-top: 14px; font-family: var(--font-ui); font-size: 11px; letter-spacing: .08em; color: var(--fg-4); }
</style></head>
<body>
  <div class="stack">
    <div class="row"><div class="meta">Spectral · 42</div><div class="specimen" style="font-size:42px">Your craft room</div></div>
    <div class="row"><div class="meta">Spectral · 32</div><div class="specimen" style="font-size:32px">Cottagecore Library</div></div>
    <div class="row"><div class="meta">Spectral · 24</div><div class="specimen" style="font-size:24px">A quiet morning ritual</div></div>
  </div>
  <div class="footnote">Spectral Regular — self-hosted from /fonts. A refined text serif carrying titles, journal names and hero lines. Falls back to DM Serif Display.</div>
</body></html>
