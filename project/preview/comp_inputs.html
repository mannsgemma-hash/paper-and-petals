<!doctype html>
<!-- @dsCard group="Components" name="Components · Inputs" subtitle="Text field, textarea, checkbox" viewport="700x280" -->
<html><head><meta charset="utf-8"><title>Inputs & fields</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-1); font-family: var(--font-ui); }
  .stack > * + * { margin-top: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 13px; color: var(--fg-2); font-weight: 500; }
  input, textarea { font-family: var(--font-ui); font-size: 16px; color: var(--fg-1); background: var(--surface-card); border: 1.5px solid var(--pp-hairline); border-radius: 6px; padding: 12px 14px; min-height: 48px; transition: border-color 180ms var(--ease-paper); }
  input:focus, textarea:focus { outline: none; border-color: var(--pp-sage); box-shadow: 0 0 0 3px rgba(135,147,124,.22); }
  textarea { min-height: 84px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .chk { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--fg-2); cursor: pointer; }
  .chk input { width: 18px; height: 18px; min-height: 18px; padding: 0; margin: 0; accent-color: var(--accent); }
</style></head>
<body>
  <div class="stack">
    <div class="field"><label>What would you like to call yourself?</label><input value="Margaret"></div>
    <div class="field"><label>Tell us a little more</label><textarea>The wax seal didn't render on my Sunday spread.</textarea></div>
    <label class="chk"><input type="checkbox" checked> Include my device info (helps us help you)</label>
  </div>
</body></html>
