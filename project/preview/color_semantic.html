<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Text & semantic" subtitle="Text ramp + success / warning / danger / hairline" viewport="700x230" -->
<html><head><meta charset="utf-8"><title>Colors — Semantic & Text</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-ui); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .col { border: 1px solid var(--pp-hairline-soft); border-radius: 10px; padding: 16px; background: var(--surface-card); }
  .col h4 { margin: 0 0 10px; font-family: var(--font-ui); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .dot { width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.04) inset; }
  .lbl { font-size: 13px; color: var(--fg-1); flex: 1; }
  .hex { font-size: 11px; color: var(--fg-3); letter-spacing: .1em; text-transform: uppercase; }
</style></head>
<body>
  <div class="grid">
    <div class="col">
      <h4>Text colors</h4>
      <div class="row"><div class="dot" style="background:#2B2A28"></div><div class="lbl"><span style="color:#2B2A28">fg-1 · Charcoal</span></div><div class="hex">#2B2A28</div></div>
      <div class="row"><div class="dot" style="background:#4B4038"></div><div class="lbl"><span style="color:#4B4038">fg-2 · Espresso</span></div><div class="hex">#4B4038</div></div>
      <div class="row"><div class="dot" style="background:#7A6B52"></div><div class="lbl"><span style="color:#7A6B52">fg-3 · Stone Warm</span></div><div class="hex">#7A6B52</div></div>
      <div class="row"><div class="dot" style="background:#9A8A72"></div><div class="lbl"><span style="color:#9A8A72">fg-4 · Stone</span></div><div class="hex">#9A8A72</div></div>
    </div>
    <div class="col">
      <h4>Semantic</h4>
      <div class="row"><div class="dot" style="background:#7A8F6E"></div><div class="lbl">success — saved</div><div class="hex">#7A8F6E</div></div>
      <div class="row"><div class="dot" style="background:#C8A96B"></div><div class="lbl">warning — gentle</div><div class="hex">#C8A96B</div></div>
      <div class="row"><div class="dot" style="background:#B26A5A"></div><div class="lbl">danger — cancel</div><div class="hex">#B26A5A</div></div>
      <div class="row"><div class="dot" style="background:#C8BC9E"></div><div class="lbl">hairline — borders</div><div class="hex">#C8BC9E</div></div>
    </div>
  </div>
</body></html>
