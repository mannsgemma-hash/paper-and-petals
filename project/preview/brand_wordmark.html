<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Wordmark & welcome script" subtitle="DM Serif wordmark + hand-lettered welcome" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Wordmark & welcome script</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-2); font-family: var(--font-ui); display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .wordmark { font-family: var(--font-display); font-size: 56px; color: var(--fg-1); line-height: 1; letter-spacing: -.01em; }
  .wordmark em { font-family: var(--font-script); font-style: italic; color: var(--pp-terracotta); font-weight: 500; padding: 0 4px; font-size: 56px; }
  .welcome { max-width: 260px; }
  .welcome img { width: 100%; display: block; opacity: .92; }
  .row { display: flex; gap: 28px; align-items: center; }
  .meta { font-family: var(--font-ui); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--fg-3); }
</style></head>
<body>
  <div class="row">
    <div class="wordmark">Paper <em>&amp;</em> Petals</div>
    <div class="meta">DM Serif Display<br>+ Cormorant Italic &amp;</div>
  </div>
  <div class="row">
    <div class="welcome"><img src="../assets/brand/welcome_script.png" alt="Welcome"></div>
    <div class="meta">Welcome script<br>(hand-lettered asset)</div>
  </div>
</body></html>
