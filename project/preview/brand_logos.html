<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Logo colorways" subtitle="Six monogram seal variants" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Logo seals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-1); font-family: var(--font-ui); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .item img { width: 96px; height: 96px; display: block; }
  .name { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; text-align: center; }
</style></head>
<body>
  <div class="grid">
    <div class="item"><img src="../assets/logos/logo_sage.png"><div class="name">Sage · primary</div></div>
    <div class="item"><img src="../assets/logos/logo_terracotta.png"><div class="name">Terracotta</div></div>
    <div class="item"><img src="../assets/logos/logo_dusty_rose.png"><div class="name">Dusty rose</div></div>
    <div class="item"><img src="../assets/logos/logo_mauve.png"><div class="name">Mauve</div></div>
    <div class="item"><img src="../assets/logos/logo_blue.png"><div class="name">Blue</div></div>
    <div class="item"><img src="../assets/logos/logo_rose.png"><div class="name">Rose</div></div>
  </div>
</body></html>
