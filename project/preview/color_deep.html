<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Deep & highlight" subtitle="Forest green CTA, charcoal text, antique gold, soft rose" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Colors — Deep & Highlight</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .swatch { border-radius: 10px; padding: 14px; height: 92px; display: flex; flex-direction: column; justify-content: space-between; color: #FFFDF6; }
  .name { font-family: var(--font-ui); font-size: 13px; font-weight: 600; }
  .hex  { font-family: var(--font-ui); font-size: 11px; letter-spacing: .12em; opacity: .9; text-transform: uppercase; }
  .role { font-family: var(--font-ui); font-size: 11px; opacity: .85; }
  .dark { color: var(--pp-charcoal); }
</style></head>
<body>
  <div class="grid">
    <div class="swatch" style="background:#4E6652"><div class="name">Forest Green</div><div><div class="hex">#4E6652</div><div class="role">primary CTA</div></div></div>
    <div class="swatch" style="background:#2B2A28"><div class="name">Soft Charcoal</div><div><div class="hex">#2B2A28</div><div class="role">text on light</div></div></div>
    <div class="swatch dark" style="background:#C8A96B"><div class="name">Antique Gold</div><div><div class="hex">#C8A96B</div><div class="role">highlight</div></div></div>
    <div class="swatch dark" style="background:#D7B7B0"><div class="name">Soft Rose</div><div><div class="hex">#D7B7B0</div><div class="role">highlight</div></div></div>
  </div>
</body></html>
