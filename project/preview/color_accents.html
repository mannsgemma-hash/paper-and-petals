<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Primary accents" subtitle="Terracotta, sage, dusty blue, mauve" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Colors — Accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .swatch { border-radius: 10px; padding: 14px; height: 92px; display: flex; flex-direction: column; justify-content: space-between; color: #FFFDF6; }
  .name { font-family: var(--font-ui); font-size: 13px; font-weight: 600; }
  .hex  { font-family: var(--font-ui); font-size: 11px; letter-spacing: .12em; opacity: .9; text-transform: uppercase; }
  .role { font-family: var(--font-ui); font-size: 11px; opacity: .85; }
</style></head>
<body>
  <div class="grid">
    <div class="swatch" style="background:#C47B63"><div class="name">Dusty Terracotta</div><div><div class="hex">#C47B63</div><div class="role">warm accent</div></div></div>
    <div class="swatch" style="background:#87937C"><div class="name">Muted Sage</div><div><div class="hex">#87937C</div><div class="role">secondary action</div></div></div>
    <div class="swatch" style="background:#8FA3B8"><div class="name">Dusty Blue</div><div><div class="hex">#8FA3B8</div><div class="role">cool accent</div></div></div>
    <div class="swatch" style="background:#A98C98"><div class="name">Vintage Mauve</div><div><div class="hex">#A98C98</div><div class="role">tertiary</div></div></div>
  </div>
</body></html>
