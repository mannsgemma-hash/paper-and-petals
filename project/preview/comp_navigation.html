<!doctype html>
<!-- @dsCard group="Components" name="Components · Navigation" subtitle="Sidebar rail with themed icons (scissors / flower / ribbon / bag) + topbar" viewport="700x280" -->
<html><head><meta charset="utf-8"><title>Navigation row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; background: var(--bg-1); font-family: var(--font-ui); }
  .wrap { padding: 22px; display: flex; gap: 18px; }
  .rail { width: 156px; background: var(--surface-card); border: 1px solid var(--pp-hairline-soft); border-radius: 14px; padding: 16px 10px; box-shadow: var(--sh-paper); }
  .brand { font-family: var(--font-display); font-size: 17px; color: var(--fg-1); padding: 4px 8px 14px; border-bottom: 1px solid var(--pp-hairline-soft); margin-bottom: 10px; letter-spacing: -.005em; line-height: 1.1; }
  .brand em { font-family: var(--font-script); font-style: italic; color: var(--pp-terracotta); font-weight: 500; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 8px; font-size: 13px; color: var(--fg-3); margin: 2px 0; min-height: 44px; box-sizing: border-box; }
  .item.active { background: var(--accent); color: var(--surface-card); }
  .item svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .topbar { flex: 1; background: var(--surface-card); border: 1px solid var(--pp-hairline-soft); border-radius: 14px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--sh-paper); }
  .back { width: 36px; height: 36px; border-radius: 999px; border: 1.5px solid var(--pp-hairline); display: grid; place-items: center; color: var(--fg-2); }
  .back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .title { font-family: var(--font-display); font-size: 22px; color: var(--fg-1); }
  .actions { display: flex; gap: 10px; }
  .ic { width: 40px; height: 40px; border-radius: 8px; background: var(--bg-2); display: grid; place-items: center; color: var(--fg-2); }
  .ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body>
  <div class="wrap">
    <div class="rail">
      <div class="brand">Paper<br/><em>&amp;</em> Petals</div>

      <div class="item active">
        <!-- scissors -->
        <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8.5L20 20M8.5 15.5L20 4"/></svg>
        Craft room
      </div>
      <div class="item">
        <!-- flower -->
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4"/><path d="M12 9.6c0-2 1-3.6 2.6-3.6S17 7.6 17 9.6"/><path d="M12 14.4c0 2 1 3.6 2.6 3.6S17 16.4 17 14.4"/><path d="M12 9.6c0-2-1-3.6-2.6-3.6S7 7.6 7 9.6"/><path d="M12 14.4c0 2-1 3.6-2.6 3.6S7 16.4 7 14.4"/></svg>
        Journals
      </div>
      <div class="item">
        <!-- ribbon -->
        <svg viewBox="0 0 24 24"><path d="M8 3l4 5 4-5"/><path d="M8 3l-3 6 7 12 7-12-3-6"/><path d="M12 8v13"/></svg>
        Collection
      </div>
      <div class="item">
        <!-- shopping bag -->
        <svg viewBox="0 0 24 24"><path d="M5 9h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>
        Shop &amp; packs
      </div>
      <div class="item">
        <!-- settings -->
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </div>
    </div>

    <div class="topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></div>
        <div class="title">Your collection</div>
      </div>
      <div class="actions">
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14 6l4 4"/></svg></div>
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></div>
      </div>
    </div>
  </div>
</body></html>
