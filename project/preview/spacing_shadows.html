<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Shadows & elevation" subtitle="Paper, card, lift, tape (rotated ephemera)" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Shadows / Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 30px; background: var(--bg-1); font-family: var(--font-ui); }
  .row { display: flex; gap: 20px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 1; }
  .box { width: 100%; height: 70px; background: var(--surface-card); border-radius: 10px; border: 1px solid var(--pp-hairline-soft); }
  .paper  { box-shadow: var(--sh-paper); }
  .card   { box-shadow: var(--sh-card); }
  .lift   { box-shadow: var(--sh-lift); }
  .tape   { box-shadow: var(--sh-tape); transform: rotate(-1.2deg); }
  .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box paper"></div><div class="lbl">paper · resting</div></div>
    <div class="item"><div class="box card"></div><div class="lbl">card · default</div></div>
    <div class="item"><div class="box lift"></div><div class="lbl">lift · hover</div></div>
    <div class="item"><div class="box tape"></div><div class="lbl">tape · ephemera</div></div>
  </div>
</body></html>
