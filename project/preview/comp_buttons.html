<!doctype html>
<!-- @dsCard group="Components" name="Components · Buttons" subtitle="Primary forest, pill, secondary, ghost, destructive" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-1); font-family: var(--font-ui); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 16px; }
  .lbl { width: 84px; flex: 0 0 84px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
  button { font-family: var(--font-ui); font-size: 15px; font-weight: 600; letter-spacing: var(--ls-ui); border: none; cursor: pointer; padding: 12px 22px; border-radius: var(--r-sm); min-height: 48px; transition: all 180ms var(--ease-paper); }
  .primary { background: var(--accent); color: var(--surface-card); box-shadow: var(--sh-paper); }
  .primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--sh-card); }
  .secondary { background: var(--surface-card); color: var(--fg-1); border: 1.5px solid var(--pp-hairline); box-shadow: var(--sh-paper); }
  .ghost { background: transparent; color: var(--fg-2); }
  .ghost:hover { background: var(--bg-2); }
  .danger { background: transparent; color: var(--pp-danger); border: 1.5px solid var(--pp-danger); }
  .pill { border-radius: 999px; padding: 12px 28px; }
</style></head>
<body>
  <div class="row"><div class="lbl">Primary</div><button class="primary">Start subscription</button><button class="primary pill">Open the parcel</button></div>
  <div class="row"><div class="lbl">Secondary</div><button class="secondary">Browse collection</button><button class="ghost">Never mind, go back</button></div>
  <div class="row"><div class="lbl">Destructive</div><button class="danger">Cancel subscription</button></div>
</body></html>
