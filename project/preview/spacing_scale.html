<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · 4px scale" subtitle="sp-1 through sp-10 with usage notes" viewport="700x320" -->
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-1); font-family: var(--font-ui); }
  .row { display: flex; align-items: center; gap: 18px; padding: 4px 0; }
  .name { width: 56px; flex: 0 0 56px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); }
  .bar { height: 16px; background: var(--pp-sage); border-radius: 3px; }
  .val { font-size: 11px; color: var(--fg-3); letter-spacing: .1em; }
</style></head>
<body>
  <div class="row"><div class="name">sp-1</div><div class="bar" style="width:4px"></div><div class="val">4px</div></div>
  <div class="row"><div class="name">sp-2</div><div class="bar" style="width:8px"></div><div class="val">8px</div></div>
  <div class="row"><div class="name">sp-3</div><div class="bar" style="width:12px"></div><div class="val">12px</div></div>
  <div class="row"><div class="name">sp-4</div><div class="bar" style="width:16px"></div><div class="val">16px</div></div>
  <div class="row"><div class="name">sp-5</div><div class="bar" style="width:20px"></div><div class="val">20px</div></div>
  <div class="row"><div class="name">sp-6</div><div class="bar" style="width:24px"></div><div class="val">24px · card padding</div></div>
  <div class="row"><div class="name">sp-7</div><div class="bar" style="width:32px"></div><div class="val">32px · large card padding</div></div>
  <div class="row"><div class="name">sp-8</div><div class="bar" style="width:40px"></div><div class="val">40px</div></div>
  <div class="row"><div class="name">sp-9</div><div class="bar" style="width:48px"></div><div class="val">48px · section gutter</div></div>
  <div class="row"><div class="name">sp-10</div><div class="bar" style="width:64px"></div><div class="val">64px</div></div>
</body></html>
