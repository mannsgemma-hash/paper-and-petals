<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Surfaces" subtitle="Warm white, soft linen, vintage paper, cream" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Colors — Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fbfaf7; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .swatch { border: 1px solid var(--pp-hairline-soft); border-radius: 10px; padding: 14px; height: 92px; display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--fg-1); }
  .hex  { font-family: var(--font-ui); font-size: 11px; letter-spacing: .12em; color: var(--fg-3); text-transform: uppercase; }
  .role { font-family: var(--font-ui); font-size: 11px; color: var(--fg-3); }
</style></head>
<body>
  <div class="grid">
    <div class="swatch" style="background:#F8F7F4"><div class="name">Warm White</div><div><div class="hex">#F8F7F4</div><div class="role">bg / canvas</div></div></div>
    <div class="swatch" style="background:#EFE9E1"><div class="name">Soft Linen</div><div><div class="hex">#EFE9E1</div><div class="role">bg-2</div></div></div>
    <div class="swatch" style="background:#E5D8C8"><div class="name">Vintage Paper</div><div><div class="hex">#E5D8C8</div><div class="role">bg-3 / tint</div></div></div>
    <div class="swatch" style="background:#FFFDF6"><div class="name">Cream</div><div><div class="hex">#FFFDF6</div><div class="role">card / sheet</div></div></div>
  </div>
</body></html>
