<!doctype html>
<!-- @dsCard group="Components" name="Components · Cards" subtitle="Default card and stitched paper card" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-2); font-family: var(--font-ui); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card { background: var(--surface-card); border: 1.5px solid var(--pp-hairline); border-radius: 16px; padding: 22px 22px 20px; box-shadow: var(--sh-card); }
  .eyebrow { font-family: var(--font-ui); font-size: 11px; letter-spacing: .20em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
  h3 { margin: 6px 0 6px; font-family: var(--font-display); font-size: 22px; color: var(--fg-1); font-weight: 400; letter-spacing: var(--ls-display); }
  p { margin: 0; font-size: 14px; color: var(--fg-2); line-height: 1.5; }
  .stitched { border: none; border-radius: 16px; padding: 22px; background: var(--pp-cream); position: relative; box-shadow: var(--sh-paper); }
  .stitched::before { content: ""; position: absolute; inset: 6px; border: 1.2px dashed var(--pp-stitch); border-radius: 12px; pointer-events: none; }
</style></head>
<body>
  <div class="grid">
    <div class="card">
      <div class="eyebrow">Today's delivery</div>
      <h3>A small parcel has arrived</h3>
      <p>One pressed flower, one antique postcard. Open when you're ready — no rush.</p>
    </div>
    <div class="stitched">
      <div class="eyebrow">Seasonal · Autumn</div>
      <h3>Antique Library pack</h3>
      <p>Twelve papers, eight ephemera, one heirloom — sealed for early Cottage access.</p>
    </div>
  </div>
</body></html>
