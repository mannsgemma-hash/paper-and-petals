<!doctype html>
<!-- @dsCard group="UI Kit — App" name="Studio CMS Admin" subtitle="Paper & Petals — back-office: item library, daily packs, schedule, feedback" viewport="1440x900" -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paper & Petals — Studio CMS</title>
  <link rel="stylesheet" href="../../colors_and_type.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg-1); color: var(--fg-1); font-family: var(--font-ui); }
    #root { height: 100%; }

    .cms-app { display: flex; height: 100%; min-width: 1080px; }

    /* ── Sidebar ─────────────────────────────────────────────── */
    .cms-sidebar {
      width: 252px; flex-shrink: 0; background: var(--surface-card);
      border-right: 1px solid var(--pp-hairline); display: flex; flex-direction: column;
      padding: 22px 16px;
    }
    .cms-brand { padding: 6px 10px 18px; }
    .cms-brand .mark { font-family: var(--font-flourish); font-size: 30px; color: var(--pp-forest, #4E6652); line-height: 1; }
    .cms-brand .sub { font-family: var(--font-paper); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-3); margin-top: 6px; }
    .cms-nav { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
    .cms-navitem {
      display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0;
      border-radius: 10px; background: transparent; color: var(--fg-2); cursor: pointer;
      font-family: var(--font-ui); font-size: 14px; font-weight: 600; text-align: left;
      transition: all 150ms var(--ease-paper);
    }
    .cms-navitem:hover { background: var(--bg-2); color: var(--fg-1); }
    .cms-navitem.on { background: rgba(78,102,82,0.12); color: var(--pp-forest, #4E6652); }
    .cms-navitem .cnt {
      margin-left: auto; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px;
      padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center;
      background: var(--bg-2); color: var(--fg-3);
    }
    .cms-navitem.on .cnt { background: var(--pp-forest, #4E6652); color: #FFFDF6; }
    .cms-side-foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--pp-hairline-soft); display: flex; align-items: center; gap: 10px; }
    .cms-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--pp-sage, #87937C); color: #FFFDF6; display: grid; place-items: center; font-family: var(--font-display); font-size: 15px; }
    .cms-side-foot .nm { font-size: 13px; font-weight: 600; }
    .cms-side-foot .rl { font-size: 11px; color: var(--fg-3); }

    /* ── Main ────────────────────────────────────────────────── */
    .cms-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .cms-topbar {
      height: 64px; flex-shrink: 0; border-bottom: 1px solid var(--pp-hairline);
      display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--bg-1);
    }
    .cms-topbar .cms-search { flex: 0 0 320px; }
    .cms-topbar .spacer { flex: 1; }
    .cms-content { flex: 1; overflow-y: auto; padding: 26px 32px 60px; }

    /* ── View headers ────────────────────────────────────────── */
    .cms-view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .cms-h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: -0.01em; }
    .cms-h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 2px 0 0; }
    .cms-sub { margin: 6px 0 0; color: var(--fg-3); font-size: 13.5px; }
    .cms-eyebrow { font-family: var(--font-paper); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-3); }
    .cms-muted { color: var(--fg-3); font-size: 13px; }

    /* ── Buttons ─────────────────────────────────────────────── */
    .cms-btn-primary, .cms-btn-secondary {
      display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px;
      border-radius: 10px; font-family: var(--font-ui); font-size: 14px; font-weight: 600;
      cursor: pointer; border: 1px solid transparent; white-space: nowrap;
      transition: filter 150ms var(--ease-paper), background 150ms;
    }
    .cms-btn-primary { background: var(--pp-forest, #4E6652); color: #FFFDF6; box-shadow: var(--sh-paper); }
    .cms-btn-primary:hover { filter: brightness(1.07); }
    .cms-btn-secondary { background: var(--surface-card); color: var(--fg-1); border-color: var(--pp-hairline); }
    .cms-btn-secondary:hover { background: var(--bg-2); }

    /* ── Toolbar / filters ───────────────────────────────────── */
    .cms-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .cms-search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: var(--surface-card); border: 1px solid var(--pp-hairline); border-radius: 10px; color: var(--fg-3); flex: 1; max-width: 340px; }
    .cms-search.sm { height: 36px; max-width: none; }
    .cms-search input { border: 0; background: transparent; outline: none; font-family: var(--font-ui); font-size: 14px; color: var(--fg-1); width: 100%; }
    .cms-segment { display: inline-flex; background: var(--surface-card); border: 1px solid var(--pp-hairline); border-radius: 10px; padding: 3px; }
    .cms-segment button { border: 0; background: transparent; padding: 7px 14px; border-radius: 7px; font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--fg-3); cursor: pointer; transition: all 150ms var(--ease-paper); }
    .cms-segment button.on { background: var(--pp-forest, #4E6652); color: #FFFDF6; }
    .cms-select { height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--pp-hairline); background: var(--surface-card); font-family: var(--font-ui); font-size: 13.5px; color: var(--fg-1); cursor: pointer; }

    /* ── Card / table ────────────────────────────────────────── */
    .cms-card { background: var(--surface-card); border: 1px solid var(--pp-hairline); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(75,64,56,0.05); }
    .cms-trow { display: grid; align-items: center; gap: 16px; padding: 12px 18px; border-top: 1px solid var(--pp-hairline-soft); }
    .cms-trow:first-child { border-top: 0; }
    .cms-thead { background: var(--bg-2); padding: 12px 18px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); font-weight: 700; }
    .cms-cell-item { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .cms-item-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cms-empty { padding: 40px; text-align: center; color: var(--fg-3); font-size: 14px; }
    .cms-empty.sm { padding: 18px; font-size: 13px; }

    /* ── Packs ───────────────────────────────────────────────── */
    .cms-packs { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
    .cms-daterail { padding: 8px; }
    .cms-dayrow { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px; border: 0; background: transparent; border-radius: 10px; cursor: pointer; text-align: left; color: var(--fg-2); transition: background 140ms; }
    .cms-dayrow:hover { background: var(--bg-2); }
    .cms-dayrow.on { background: rgba(78,102,82,0.10); }
    .cms-day-cal { width: 44px; height: 44px; flex-shrink: 0; border-radius: 9px; background: var(--bg-2); border: 1px solid var(--pp-hairline); display: grid; place-items: center; line-height: 1; }
    .cms-dayrow.on .cms-day-cal { background: var(--surface-card); border-color: var(--pp-forest, #4E6652); }
    .cms-day-cal .wd { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); }
    .cms-day-cal .dm { font-family: var(--font-display); font-size: 18px; color: var(--fg-1); }
    .cms-day-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: var(--fg-1); }
    .cms-today { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; background: var(--pp-forest, #4E6652); color: #FFFDF6; padding: 2px 6px; border-radius: 999px; }
    .cms-day-meta { display: flex; align-items: center; font-size: 12px; color: var(--fg-3); margin-top: 3px; }
    .cms-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .cms-trackbar { display: flex; gap: 10px; margin-top: 18px; }
    .cms-track { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 12px 14px; border-radius: 11px; border: 1.5px solid var(--pp-hairline); background: var(--surface-card); color: var(--fg-3); font-family: var(--font-ui); font-size: 14px; font-weight: 700; cursor: pointer; transition: all 150ms var(--ease-paper); }
    .cms-track-cnt { font-size: 12px; font-weight: 700; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--bg-2); color: var(--fg-3); }
    .cms-track-blurb { display: flex; align-items: center; gap: 7px; margin: 12px 0 0; font-size: 12.5px; color: var(--fg-3); }
    .cms-packdetail { padding: 22px; }
    .cms-packdetail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .cms-addpanel { margin-top: 16px; background: var(--bg-2); border: 1px solid var(--pp-hairline); border-radius: 12px; padding: 12px; }
    .cms-addlist { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; max-height: 280px; overflow-y: auto; }
    .cms-addrow { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; text-align: left; color: var(--fg-1); }
    .cms-addrow:hover { background: var(--surface-card); }
    .cms-addrow-name { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cms-addrow svg:last-child { color: var(--pp-forest, #4E6652); }
    .cms-tier-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .cms-tier-tag.free { background: rgba(78,102,82,0.12); color: #3F5443; }
    .cms-tier-tag.paid { background: rgba(168,137,63,0.18); color: #7E6322; }
    .cms-packempty { padding: 40px 24px; text-align: center; color: var(--fg-3); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .cms-packempty p { margin: 0; max-width: 360px; font-size: 14px; line-height: 1.5; }
    .cms-chipgrid { margin-top: 18px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .cms-itemchip { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--bg-1); border: 1px solid var(--pp-hairline); border-radius: 12px; }
    .cms-chip-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cms-chip-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .cms-chip-x { border: 0; background: transparent; color: var(--fg-4); cursor: pointer; padding: 6px; border-radius: 8px; flex-shrink: 0; }
    .cms-chip-x:hover { background: rgba(178,106,90,0.12); color: var(--pp-danger, #B26A5A); }

    /* ── Schedule ────────────────────────────────────────────── */
    .cms-monthnav { display: inline-flex; align-items: center; gap: 6px; }
    .cms-monthnav span { font-family: var(--font-display); font-size: 18px; min-width: 150px; text-align: center; }
    .cms-monthnav button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--pp-hairline); background: var(--surface-card); color: var(--fg-2); cursor: pointer; display: grid; place-items: center; }
    .cms-monthnav button:hover { background: var(--bg-2); }
    .cms-legend { display: flex; gap: 20px; margin-bottom: 14px; font-size: 12.5px; color: var(--fg-3); }
    .cms-legend span { display: inline-flex; align-items: center; gap: 7px; }
    .cms-legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
    .cms-legend i.ring { background: transparent; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--pp-forest, #4E6652); }
    .cms-cal { padding: 0; }
    .cms-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cms-cal-head { border-bottom: 1px solid var(--pp-hairline); }
    .cms-cal-wd { padding: 12px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); font-weight: 700; text-align: left; }
    .cms-cal-cell { min-height: 104px; border-right: 1px solid var(--pp-hairline-soft); border-bottom: 1px solid var(--pp-hairline-soft); padding: 8px; position: relative; }
    .cms-cal-cell:nth-child(7n) { border-right: 0; }
    .cms-cal-cell.empty { background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(75,64,56,0.025) 6px 12px); }
    .cms-cal-num { font-size: 13px; font-weight: 600; color: var(--fg-2); }
    .cms-cal-cell.today .cms-cal-num { background: var(--pp-forest, #4E6652); color: #FFFDF6; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; }
    .cms-cal-events { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    .cms-cal-ev { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cms-cal-ev.pack { background: rgba(78,102,82,0.12); color: #3F5443; }
    .cms-cal-ev.launch { background: rgba(168,137,63,0.18); color: #7E6322; }

    /* ── Feedback ────────────────────────────────────────────── */
    .cms-fblist { display: flex; flex-direction: column; gap: 12px; }
    .cms-fbcard { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; background: var(--surface-card); border: 1px solid var(--pp-hairline); border-radius: 14px; }
    .cms-fbcard.unread { border-left: 3px solid var(--pp-forest, #4E6652); }
    .cms-fb-type { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
    .cms-fb-top { display: flex; align-items: center; gap: 10px; }
    .cms-fb-typelabel { font-size: 12px; font-weight: 700; letter-spacing: 0.03em; }
    .cms-fb-date { margin-left: auto; }
    .cms-fb-msg { margin: 6px 0 8px; font-size: 14px; line-height: 1.5; color: var(--fg-1); }
    .cms-fb-from { font-size: 12.5px; color: var(--fg-3); display: flex; align-items: center; gap: 6px; }
    .cms-fb-from a { color: var(--pp-forest, #4E6652); text-decoration: none; }
    .cms-fb-read { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--pp-hairline); background: var(--surface-card); color: var(--fg-2); border-radius: 999px; padding: 7px 13px; font-family: var(--font-ui); font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .cms-fb-read:hover { background: var(--bg-2); }
    .cms-fbcard.unread .cms-fb-read { background: var(--pp-forest, #4E6652); color: #FFFDF6; border-color: transparent; }

    /* ── Modal ───────────────────────────────────────────────── */
    .cms-scrim { position: fixed; inset: 0; z-index: 60; background: rgba(45,38,30,0.45); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 24px; animation: cms-fade 180ms ease both; }
    @keyframes cms-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cms-pop { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }
    .cms-modal { width: 100%; max-width: 520px; background: var(--surface-card); border-radius: 18px; border: 1px solid var(--pp-hairline); box-shadow: 0 30px 60px -20px rgba(45,38,30,0.45); overflow: hidden; animation: cms-pop 240ms var(--ease-paper) both; }
    .cms-modal-head { padding: 20px 24px; border-bottom: 1px solid var(--pp-hairline); background: linear-gradient(180deg, #FFFDF6, #F7F2E8); display: flex; align-items: center; justify-content: space-between; }
    .cms-modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .cms-field label { display: block; font-size: 12px; font-weight: 600; color: var(--fg-2); margin-bottom: 6px; letter-spacing: 0.02em; }
    .cms-input, .cms-modal-body select { width: 100%; height: 44px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--pp-hairline); background: var(--pp-cream, #FFFDF6); font-family: var(--font-ui); font-size: 15px; color: var(--fg-1); outline: none; }
    .cms-input:focus, .cms-modal-body select:focus { border-color: var(--pp-forest, #4E6652); box-shadow: 0 0 0 3px rgba(78,102,82,0.12); }
    .cms-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .cms-radios { display: flex; flex-direction: column; gap: 8px; }
    .cms-radio { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1.5px solid var(--pp-hairline); border-radius: 10px; cursor: pointer; font-size: 14px; }
    .cms-radio.on { border-color: var(--pp-forest, #4E6652); background: rgba(78,102,82,0.07); }
    .cms-radio input { accent-color: var(--pp-forest, #4E6652); }
    .cms-modal-foot { padding: 16px 24px; border-top: 1px solid var(--pp-hairline); display: flex; justify-content: flex-end; gap: 10px; }
    .cms-icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--pp-hairline); background: var(--surface-card); display: grid; place-items: center; cursor: pointer; color: var(--fg-1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="data.js"></script>
  <script type="text/babel" src="cms-ui.jsx"></script>
  <script type="text/babel" src="Library.jsx"></script>
  <script type="text/babel" src="Packs.jsx"></script>
  <script type="text/babel" src="Schedule.jsx"></script>
  <script type="text/babel" src="Feedback.jsx"></script>

  <script type="text/babel">
    const { useState } = React;
    const CMS = window.CMS;

    const NAV = [
      { id: 'library',  label: 'Library',       icon: 'library' },
      { id: 'packs',    label: 'Daily packs',   icon: 'pack' },
      { id: 'schedule', label: 'Schedule',      icon: 'calendar' },
      { id: 'feedback', label: 'Feedback',      icon: 'inbox' },
    ];

    function NewItemModal({ onClose, onCreate }) {
      const [name, setName] = useState('');
      const [category, setCategory] = useState(CMS.CATEGORIES[0].id);
      const [tier, setTier] = useState('free');
      const [price, setPrice] = useState('1.99');
      const [when, setWhen] = useState('now'); // now | schedule | draft
      const [date, setDate] = useState('2026-06-20');

      const glyphFor = { collections: 'collection', papers: 'paper', stickers: 'seal', tape: 'tape', ephemera: 'card', florals: 'flower', frames: 'frame', type: 'type', paint: 'paint', fabric: 'fabric', photos: 'frame', details: 'charm' };

      const save = () => {
        const publishAt = when === 'now' ? CMS.TODAY : when === 'schedule' ? date : null;
        onCreate({
          id: 'new-' + Date.now(),
          name: name.trim() || 'Untitled item',
          category, tier,
          price: tier === 'paid' ? (parseFloat(price) || 0) : 0,
          publishAt,
          glyph: glyphFor[category] || 'paper',
        });
        onClose();
      };

      return (
        <div className="cms-scrim" onClick={onClose}>
          <div className="cms-modal" onClick={(e) => e.stopPropagation()}>
            <div className="cms-modal-head">
              <div>
                <div className="cms-eyebrow">New library item</div>
                <h2 className="cms-h2">Add an item</h2>
              </div>
              <button className="cms-icon-btn" onClick={onClose} aria-label="Close"><CmsIcon name="plus" size={18} stroke={2} style={{ transform: 'rotate(45deg)' }}/></button>
            </div>
            <div className="cms-modal-body">
              <div className="cms-field">
                <label>Name</label>
                <input className="cms-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Pressed bluebells" autoFocus/>
              </div>
              <div className="cms-row2">
                <div className="cms-field">
                  <label>Category</label>
                  <select value={category} onChange={(e) => setCategory(e.target.value)}>
                    {CMS.CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                  </select>
                </div>
                <div className="cms-field">
                  <label>Tier</label>
                  <div style={{ height: 44, display: 'flex', alignItems: 'center' }}>
                    <TierToggle tier={tier} onChange={setTier}/>
                  </div>
                </div>
              </div>
              {tier === 'paid' && (
                <div className="cms-field">
                  <label>Price (USD)</label>
                  <input className="cms-input" type="number" step="0.5" min="0" value={price} onChange={(e) => setPrice(e.target.value)}/>
                </div>
              )}
              <div className="cms-field">
                <label>Availability</label>
                <div className="cms-radios">
                  {[['now', 'Publish now — goes live today'], ['schedule', 'Schedule for a future date'], ['draft', 'Save as draft']].map(([id, lab]) => (
                    <label key={id} className={'cms-radio' + (when === id ? ' on' : '')}>
                      <input type="radio" name="when" checked={when === id} onChange={() => setWhen(id)}/>
                      {lab}
                    </label>
                  ))}
                </div>
                {when === 'schedule' && (
                  <input className="cms-input" type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ marginTop: 10 }}/>
                )}
              </div>
            </div>
            <div className="cms-modal-foot">
              <button className="cms-btn-secondary" onClick={onClose}>Cancel</button>
              <button className="cms-btn-primary" onClick={save}><CmsIcon name="check" size={17} stroke={2.2}/> Create item</button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = useState('library');
      const [items, setItems] = useState(() => CMS.ITEMS.map(i => ({ ...i })));
      const [packs, setPacks] = useState(() => CMS.PACKS.map(p => ({ ...p, free: [...p.free], sub: [...p.sub] })));
      const [feedback, setFeedback] = useState(() => CMS.FEEDBACK.map(f => ({ ...f })));
      const [newOpen, setNewOpen] = useState(false);

      const setTier = (id, tier) => setItems(prev => prev.map(i => i.id === id ? { ...i, tier, price: tier === 'free' ? 0 : (i.price || 1.99) } : i));
      const addToPack = (date, track, id) => setPacks(prev => prev.map(p => p.date === date && !p[track].includes(id) ? { ...p, [track]: [...p[track], id] } : p));
      const removeFromPack = (date, track, id) => setPacks(prev => prev.map(p => p.date === date ? { ...p, [track]: p[track].filter(x => x !== id) } : p));
      const toggleRead = (id) => setFeedback(prev => prev.map(f => f.id === id ? { ...f, read: !f.read } : f));
      const createItem = (item) => { setItems(prev => [item, ...prev]); setView('library'); };

      const counts = {
        library: items.length,
        packs: packs.filter(p => p.date >= CMS.TODAY).length,
        feedback: feedback.filter(f => !f.read).length,
      };

      return (
        <div className="cms-app">
          <aside className="cms-sidebar">
            <div className="cms-brand">
              <div className="mark">Paper &amp; Petals</div>
              <div className="sub">Studio CMS</div>
            </div>
            <nav className="cms-nav">
              {NAV.map(n => (
                <button key={n.id} className={'cms-navitem' + (view === n.id ? ' on' : '')} onClick={() => setView(n.id)}>
                  <CmsIcon name={n.icon} size={19}/>
                  {n.label}
                  {counts[n.id] != null && counts[n.id] > 0 && <span className="cnt">{counts[n.id]}</span>}
                </button>
              ))}
            </nav>
            <div className="cms-side-foot">
              <div className="cms-avatar">A</div>
              <div>
                <div className="nm">Alice Wren</div>
                <div className="rl">Studio editor</div>
              </div>
            </div>
          </aside>

          <main className="cms-main">
            <div className="cms-topbar">
              <div className="cms-search">
                <CmsIcon name="search" size={16}/>
                <input placeholder="Search the library, packs, feedback…"/>
              </div>
              <div className="spacer"></div>
              <button className="cms-btn-primary" onClick={() => setNewOpen(true)}>
                <CmsIcon name="plus" size={17} stroke={2.2}/> New item
              </button>
            </div>

            <div className="cms-content">
              {view === 'library'  && <Library items={items} onTierChange={setTier} onNew={() => setNewOpen(true)}/>}
              {view === 'packs'     && <Packs packs={packs} items={items} onAddItem={addToPack} onRemoveItem={removeFromPack}/>}
              {view === 'schedule'  && <Schedule items={items} packs={packs}/>}
              {view === 'feedback'  && <Feedback feedback={feedback} onToggleRead={toggleRead}/>}
            </div>
          </main>

          {newOpen && <NewItemModal onClose={() => setNewOpen(false)} onCreate={createItem}/>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
