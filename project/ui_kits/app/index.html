<!doctype html>
<!-- @dsCard group="UI Kit — App" name="App UI Kit" subtitle="Paper & Petals — click-through: loading, welcome, craft room, journal editor, support, subscription" viewport="1024x768" -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paper & Petals — App UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="tokens.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="pp-host">

  <style>
    /* Launch-state picker — sits just below the screen tab bar so reviewers can
       see how the loading screen routes for each user state. */
    /* Push the frame down a little so the launchbar doesn't clip its top edge. */
    .pp-frame { margin-top: 152px !important; }
    .pp-launchbar {
      position: fixed; top: 108px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px;
      padding: 4px 8px;
      background: rgba(255,253,246,0.78);
      backdrop-filter: blur(6px);
      border: 1px solid var(--pp-hairline);
      border-radius: 999px;
      box-shadow: 0 6px 14px -6px rgba(75,64,56,0.18);
      z-index: 50;
      font-family: var(--font-ui);
      font-size: 12px;
    }
    .pp-launchbar .label {
      padding: 0 6px 0 10px; color: var(--fg-3);
      letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px;
    }
    .pp-launchchip {
      font-family: var(--font-ui);
      font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 999px;
      border: 0; background: transparent; color: var(--fg-2);
      cursor: pointer; white-space: nowrap;
      transition: all 160ms var(--ease-paper);
    }
    .pp-launchchip:hover { background: var(--bg-2); color: var(--fg-1); }
    .pp-launchchip.active { background: var(--pp-forest, #4E6652); color: #FFFDF6; }

    /* Device toggle — Tablet (1024×768) vs Phone (390×844) preview. Sits at the
       top-left so it clears the centred launch-state bar. */
    .pp-devicebar {
      position: fixed; top: 64px; left: 16px;
      display: flex; align-items: center; gap: 8px;
      padding: 4px 8px;
      background: rgba(255,253,246,0.78);
      backdrop-filter: blur(6px);
      border: 1px solid var(--pp-hairline);
      border-radius: 999px;
      box-shadow: 0 6px 14px -6px rgba(75,64,56,0.18);
      z-index: 50;
      font-family: var(--font-ui);
    }
    .pp-devicebar .label {
      padding: 0 2px 0 8px; color: var(--fg-3);
      letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px;
    }
    .pp-devicechip {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-ui); font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 999px;
      border: 0; background: transparent; color: var(--fg-2);
      cursor: pointer; white-space: nowrap;
      transition: all 160ms var(--ease-paper);
    }
    .pp-devicechip:hover { background: var(--bg-2); color: var(--fg-1); }
    .pp-devicechip.active { background: var(--pp-forest, #4E6652); color: #FFFDF6; }

    /* Disabled tabs in phone mode (screens that don't reflow yet). */
    .pp-tab.disabled { opacity: 0.34; cursor: not-allowed; }
    .pp-tab.disabled:hover { background: transparent; color: var(--fg-3); }
    .pp-tab .tab-note {
      font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--fg-4); margin-left: 6px; font-weight: 700;
    }

    /* Phone preview — narrow portrait frame with rounded device corners and a
       home indicator. The inner stage fills the frame instead of forcing 1024px. */
    .pp-frame[data-device="phone"] {
      width: 390px !important;
      height: 844px !important;
      border-radius: 42px;
    }
    .pp-frame[data-device="phone"]::after {
      content: "";
      position: absolute; left: 50%; bottom: 9px; transform: translateX(-50%);
      width: 128px; height: 5px; border-radius: 999px;
      background: rgba(75,64,56,0.26); z-index: 60; pointer-events: none;
    }
    .pp-frame[data-device="phone"] .pp-stage { width: 100% !important; height: 100% !important; }
  </style>

  <!-- Screen tab bar (matches the figma mock chrome) -->
  <div class="pp-tabbar" id="tabbar"></div>
  <!-- Device preview toggle — Tablet vs Phone -->
  <div class="pp-devicebar" id="devicebar"></div>
  <!-- Simulated launch state — controls what the loading screen routes to -->
  <div class="pp-launchbar" id="launchbar"></div>

  <!-- 1024x768 frame, mounted from React -->
  <div class="pp-frame" data-screen-label="01 App UI Kit">
    <div id="root" style="width: 100%; height: 100%;"></div>
  </div>

  <script type="text/babel" src="Icon.jsx"></script>
  <script type="text/babel" src="Loading.jsx"></script>
  <script type="text/babel" src="Welcome.jsx"></script>
  <script type="text/babel" src="PackageOpening.jsx"></script>
  <script type="text/babel" src="JournalCovers.jsx"></script>
  <script type="text/babel" src="HomeScreen.jsx"></script>
  <script type="text/babel" src="Shop.jsx"></script>
  <script type="text/babel" src="JournalEditor.jsx"></script>
  <script type="text/babel" src="SupportMenu.jsx"></script>
  <script type="text/babel" src="LegalModal.jsx"></script>
  <script type="text/babel" src="FeedbackModal.jsx"></script>
  <script type="text/babel" src="Settings.jsx"></script>
  <script type="text/babel" src="Subscription.jsx"></script>

  <script type="text/babel">
    const SCREENS = [
      { id: 'loading',  label: 'SCR-01 Loading' },
      { id: 'welcome',  label: 'SCR-02 Welcome' },
      { id: 'package',  label: 'SCR-03 Package' },
      { id: 'room',     label: 'SCR-05 Home' },
      { id: 'shop',     label: 'SCR-06 Shop' },
      { id: 'editor',   label: 'SCR-07 Journal Editor' },
      { id: 'settings', label: 'SCR-23 Settings' },
      { id: 'sub',      label: 'SCR-24 Subscription' },
    ];

    // Three launch states the loading screen routes from when it finishes.
    const LAUNCH_STATES = [
      { id: 'subsequent',  label: 'Returning · later today',  target: 'room',    note: '→ Home' },
      { id: 'first_today', label: 'Returning · first today',  target: 'package', note: '→ Package' },
      { id: 'new_user',    label: 'New user · first launch',  target: 'welcome', note: '→ Welcome' },
    ];

    // Screens that have a verified phone reflow. The rest stay tablet-only for now,
    // so the picker disables them when previewing on a phone.
    const PHONE_SCREENS = ['welcome', 'settings', 'sub'];
    const DEVICES = [
      { id: 'tablet', label: 'Tablet', dim: '1024 × 768' },
      { id: 'phone',  label: 'Phone',  dim: '390 × 844' },
    ];

    function App() {
      const [screen, setScreen] = React.useState('loading');
      const [supportOpen, setSupportOpen] = React.useState(false);
      // Global membership flag. Subscribing in Settings removes the ad banners
      // on Home (SCR-05) and the Journal Editor (SCR-07).
      const [subscribed, setSubscribed] = React.useState(false);
      // Remembers which screen opened the Shop so its back button returns there
      // (Home or the Journal Editor) instead of always going Home.
      const [shopOrigin, setShopOrigin] = React.useState('room');
      const [progress, setProgress] = React.useState(0);
      const [launchState, setLaunchState] = React.useState('first_today');
      // Device preview: 'tablet' (default) or 'phone'. Phone only supports the
      // reflowed screens (Welcome, Settings, Subscription).
      const [device, setDevice] = React.useState('tablet');
      const completedRef = React.useRef(false);

      const switchDevice = (next) => {
        setDevice(next);
        if (next === 'phone' && !PHONE_SCREENS.includes(screen)) setScreen('welcome');
      };

      // ── Shared journal library ─────────────────────────────────────
      // SCR-05 Home displays this list. SCR-07 Editor opens whichever entry the
      // user tapped; changes (name, cover, etc.) flow back via updateJournal
      // so the carousel reflects the latest design on return.
      const [journals, setJournals] = React.useState(() => SEED_JOURNALS);
      const [activeJournalId, setActiveJournalId] = React.useState(null);
      const activeJournal = journals.find(j => j.id === activeJournalId) || null;

      const openJournal = (journal, index) => {
        if (journal.isNew) {
          // Create a new journal at the end with the default name pattern.
          const realCount = journals.filter(j => !j.isNew).length;
          const created = {
            id: `j-${Date.now()}`,
            name: `Journal ${realCount + 1}`,
            frontCover: 'linen-cream',
            backCover:  'linen-cream',
            items: 0,
            edited: 'just now',
          };
          setJournals(prev => {
            const real = prev.filter(j => !j.isNew);
            const newSlot = prev.find(j => j.isNew);
            return [...real, created, newSlot].filter(Boolean);
          });
          setActiveJournalId(created.id);
        } else {
          setActiveJournalId(journal.id);
        }
        setScreen('editor');
      };

      const updateActiveJournal = React.useCallback((updates) => {
        if (!activeJournalId) return;
        setJournals(prev => prev.map(j =>
          j.id === activeJournalId ? { ...j, ...updates, edited: 'just now' } : j
        ));
      }, [activeJournalId]);

      // Restart the progress whenever the loading screen is shown.
      React.useEffect(() => {
        if (screen === 'loading') {
          setProgress(0);
          completedRef.current = false;
        }
      }, [screen]);

      // Forward-only sweep — fills ~8s, then Loading fires onComplete.
      React.useEffect(() => {
        if (screen !== 'loading') return;
        const id = setInterval(() => {
          setProgress(p => Math.min(1, p + 0.025));
        }, 200);
        return () => clearInterval(id);
      }, [screen]);

      const handleLoadComplete = React.useCallback(() => {
        if (completedRef.current) return;
        completedRef.current = true;
        const target = LAUNCH_STATES.find(s => s.id === launchState)?.target || 'room';
        setScreen(target);
      }, [launchState]);

      // Render the tab bar + launch-state picker via plain DOM (outside the frame).
      React.useEffect(() => {
        const bar = document.getElementById('tabbar');
        bar.innerHTML = '';
        SCREENS.forEach(s => {
          const b = document.createElement('button');
          const locked = device === 'phone' && !PHONE_SCREENS.includes(s.id);
          b.className = 'pp-tab' + (s.id === screen ? ' active' : '') + (locked ? ' disabled' : '');
          if (locked) {
            b.innerHTML = `${s.label} <span class="tab-note">Tablet</span>`;
            b.title = 'Tablet-only layout — switch to Tablet to preview this screen';
          } else {
            b.textContent = s.label;
            b.onclick = () => setScreen(s.id);
          }
          bar.appendChild(b);
        });

        // Device toggle.
        const db = document.getElementById('devicebar');
        db.innerHTML = '';
        const dlab = document.createElement('span');
        dlab.className = 'label';
        dlab.textContent = 'Preview';
        db.appendChild(dlab);
        DEVICES.forEach(d => {
          const b = document.createElement('button');
          b.className = 'pp-devicechip' + (d.id === device ? ' active' : '');
          b.innerHTML = `${d.label} <span style="opacity:.6;font-weight:500;font-size:11px;">${d.dim}</span>`;
          b.onclick = () => switchDevice(d.id);
          db.appendChild(b);
        });

        const lb = document.getElementById('launchbar');
        // Launch states route the loading screen — only relevant on tablet.
        lb.style.display = device === 'phone' ? 'none' : '';
        lb.innerHTML = '';
        const lab = document.createElement('span');
        lab.className = 'label';
        lab.textContent = 'Launch as';
        lb.appendChild(lab);
        LAUNCH_STATES.forEach(s => {
          const b = document.createElement('button');
          b.className = 'pp-launchchip' + (s.id === launchState ? ' active' : '');
          b.innerHTML = `${s.label} <span style="opacity:.6;margin-left:6px;font-weight:500;">${s.note}</span>`;
          b.onclick = () => setLaunchState(s.id);
          lb.appendChild(b);
        });

        // Resize the frame to the chosen device.
        const frame = document.querySelector('.pp-frame');
        if (frame) frame.setAttribute('data-device', device);
      }, [screen, launchState, device]);

      return (
        <>
          {screen === 'loading' && (
            <Loading progress={progress} onComplete={handleLoadComplete} />
          )}
          {screen === 'welcome' && (
            <Welcome
              device={device}
              onBegin={() => setScreen('package')}
              onSubscribe={() => setScreen('sub')}
            />
          )}
          {screen === 'package' && (
            <PackageOpening onContinue={() => setScreen('room')} />
          )}
          {screen === 'room' && (
            <HomeScreen
              journals={journals}
              onJournalTap={openJournal}
              onShop={() => { setShopOrigin('room'); setScreen('shop'); }}
              onSettings={() => setScreen('settings')}
              subscribed={subscribed}
            />
          )}
          {screen === 'shop' && (
            <Shop
              onBack={() => setScreen(shopOrigin)}
              onSettings={() => setScreen('settings')}
            />
          )}
          {screen === 'settings' && (
            <Settings
              device={device}
              onBack={() => setScreen('room')}
              onStartSubscription={() => setScreen('sub')}
              onManageSubscription={() => setScreen('sub')}
              subscribed={subscribed}
              onToggleSubscribed={() => setSubscribed(s => !s)}
            />
          )}
          {screen === 'editor' && (
            <JournalEditor
              key={activeJournalId || 'editor'}
              journal={activeJournal}
              onSave={updateActiveJournal}
              onBack={() => setScreen('room')}
              onSupportTap={() => setSupportOpen(true)}
              subscribed={subscribed}
              onUpgrade={() => setScreen('sub')}
              onShop={() => { setShopOrigin('editor'); setScreen('shop'); }}
            />
          )}
          {screen === 'sub' && (
            <Subscription device={device} onBack={() => setScreen(device === 'phone' ? 'settings' : 'room')} />
          )}

          {supportOpen && (
            <SupportMenu
              onClose={() => setSupportOpen(false)}
              onSelect={(id) => {
                setSupportOpen(false);
                if (id === 'subscription') setScreen('sub');
              }}
            />
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
