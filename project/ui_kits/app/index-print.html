<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paper &amp; Petals — App UI Kit (Print)</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="tokens.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    /* ── Print-ready page model ─────────────────────────────────────
       Each app screen renders into its own fixed 1024×768 page, matching
       the on-device frame exactly. One screen per printed sheet. */
    @page { size: 1024px 768px; margin: 0; }

    html, body {
      margin: 0; padding: 0;
      background: #fff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* On-screen review backdrop (does not print). */
    body.pp-host {
      background: var(--bg-2);
      padding: 24px 0;
    }

    .print-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .print-page {
      width: 1024px;
      height: 768px;
      position: relative;
      overflow: hidden;
      background: var(--bg-1);
      box-shadow: 0 20px 50px -28px rgba(75,64,56,.30);
      border: 1px solid var(--pp-hairline);
    }

    /* Screens built on .pp-stage already paint their own background; make sure
       the stage fills the page. */
    .print-page > .pp-stage,
    .print-page > div {
      width: 100% !important;
      height: 100% !important;
    }

    @media print {
      body.pp-host { background: #fff; padding: 0; }
      .print-stack { gap: 0; }
      .print-page {
        box-shadow: none;
        border: none;
        break-after: page;
        page-break-after: always;
      }
      .print-page:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body class="pp-host">

  <div id="root"></div>

  <script type="text/babel" src="Icon.jsx"></script>
  <script type="text/babel" src="Loading.jsx"></script>
  <script type="text/babel" src="Welcome.jsx"></script>
  <script type="text/babel" src="PackageOpening.jsx"></script>
  <script type="text/babel" src="JournalCovers.jsx"></script>
  <script type="text/babel" src="HomeScreen.jsx"></script>
  <script type="text/babel" src="Shop.jsx"></script>
  <script type="text/babel" src="JournalEditor.jsx"></script>
  <script type="text/babel" src="SupportMenu.jsx"></script>
  <script type="text/babel" src="LegalModal.jsx"></script>
  <script type="text/babel" src="Settings.jsx"></script>
  <script type="text/babel" src="Subscription.jsx"></script>

  <script type="text/babel">
    const noop = () => {};

    function PrintDeck() {
      const journals = window.SEED_JOURNALS || [];
      const firstJournal = journals.find(j => !j.isNew) || null;

      const pages = [
        // SCR-01 Loading — frozen mid-progress so the bar + seal read clearly.
        <Loading progress={0.62} onComplete={noop} />,
        // SCR-02 Welcome
        <Welcome onBegin={noop} onSubscribe={noop} />,
        // SCR-03 Package opening (initial "closed" state)
        <PackageOpening onContinue={noop} />,
        // SCR-05 Home
        <HomeScreen journals={journals} onJournalTap={noop} onShop={noop} onSettings={noop} />,
        // SCR-06 Shop
        <Shop onBack={noop} onSettings={noop} />,
        // SCR-07 Journal editor
        <JournalEditor journal={firstJournal} onSave={noop} onBack={noop} onSupportTap={noop} />,
        // SCR-23 Settings
        <Settings onBack={noop} onStartSubscription={noop} onManageSubscription={noop} />,
        // SCR-24 Subscription
        <Subscription onBack={noop} />,
      ];

      const labels = [
        'SCR-01 Loading', 'SCR-02 Welcome', 'SCR-03 Package', 'SCR-05 Home',
        'SCR-06 Shop', 'SCR-07 Journal Editor', 'SCR-23 Settings', 'SCR-24 Subscription',
      ];

      return (
        <div className="print-stack">
          {pages.map((el, i) => (
            <div className="print-page" data-screen-label={labels[i]} key={i}>
              {el}
            </div>
          ))}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PrintDeck />);
  </script>
</body>
</html>
